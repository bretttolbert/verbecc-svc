[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "verbecc-svc"
version = "2.0.0"
dependencies = [
  "backports.strenum (>=1.3.1,<2.0) ; python_version < '3.11'",
  "cython>=3.1.4",
  "dataclass-wizard==0.35.1",
  "fastapi==0.121.3",
  "importlib_resources==6.4.5 ; python_version < '3.13'",
  "importlib_resources==6.5.2 ; python_version >= '3.13'",
  "jsbeautifier>=1.15.4,<2.0",
  "lxml-stubs>=0.5.1",
  "lxml>=6.0.2",
  "mock==5.2.0",
  "numpy==1.26.2 ; python_version < '3.11'",
  "numpy==2.3.3 ; python_version >= '3.11'",
  "pyaml==25.7.0",
  "pylama==8.4.1",
  "pytest-cov==4.1.0",
  "pytest==7.4.4",
  "requests==2.32.5",
  "scikit-learn==1.6.1 ; python_version < '3.10'",
  "scikit-learn==1.7.2 ; python_version >= '3.10'",
  "scipy==1.13.1 ; python_version < '3.10'",
  "scipy==1.15.3 ; python_version == '3.10'",
  "scipy==1.16.2 ; python_version >= '3.11'",
  "starlette==0.50.0",
  "uvicorn==0.38.0",
  "verbecc==2.0.0",
]
requires-python = ">=3.9"
authors = [{ name = "Brett Tolbert", email = "bretttolbert@gmail.com" }]
maintainers = [{ name = "Brett Tolbert", email = "bretttolbert@gmail.com" }]
description = "Micro-Service for Verbecc: Verbs Completely Conjugated: machine learning verb conjugator for Catalan, French, Italian, Portuguese, Romanian and Spanish"
readme = "README.md"
license = { file = "LICENSE.txt" }
keywords = [
  'verb,',
  'conjugator',
  'conjugation',
  'Catalan',
  'català',
  'French',
  'français',
  'Italian',
  'italiano',
  'Portuguese',
  'português',
  'Romanian',
  'română',
  'Spanish',
  'español',
  'NLP',
  'Natural Language Processing',
  'Machine Learning',
  'Linguistics',
  'Education',
  'Language Learning',
]
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Intended Audience :: Developers',
  'Intended Audience :: Education',
  'Intended Audience :: End Users/Desktop',
  'Intended Audience :: Science/Research',
  'License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)',
  'Natural Language :: Catalan',
  'Natural Language :: French',
  'Natural Language :: Italian',
  'Natural Language :: Portuguese',
  'Natural Language :: Romanian',
  'Natural Language :: Spanish',
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Programming Language :: Python :: 3.9',
  'Programming Language :: Python :: 3',
  'Topic :: Education',
  'Topic :: Scientific/Engineering :: Artificial Intelligence',
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Topic :: Text Processing :: Linguistic',
  'Topic :: Utilities',
]

[project.urls]
Homepage = "https://github.com/bretttolbert/verbecc-svc"
Documentation = "https://github.com/bretttolbert/verbecc-svc"
Repository = "https://github.com/bretttolbert/verbecc-svc.git"
"Bug Tracker" = "https://github.com/bretttolbert/verbecc-svc/issues"
Changelog = "https://github.com/bretttolbert/verbecc-svc/blob/master/CHANGELOG.md"

[tool.setuptools.packages]
find = {}

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
    "tests"
]
norecursedirs = [
    ".git",
    ".tox",
    "build",
    "dist",
    "venv",
    "docs",
    "__pycache__",
    "data",
    "doc"
]
addopts = [
    "--ignore=.git",
    "--ignore=.tox",
    "--ignore=build",
    "--ignore=dist",
    "--ignore=__pycache__",
    "--ignore=data",
    "--ignore=doc"
]